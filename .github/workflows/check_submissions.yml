name: Check student submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # jednou týdně v pondělí v 06:00 UTC (uprav dle potřeby)

permissions:
  contents: read

env:
  ORG_NAME: SPSMotol      # změň, pokud máš jinou organizaci
  FILE_NAME: tramvaj.html # soubor, který kontrolujeme
  EXCLUDE_REPOS: template,# odděl čárkami repo, která nechceš kontrolovat

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          echo "Running check for org: $ORG_NAME, file: $FILE_NAME"
          echo "Excluded repos: $EXCLUDE_REPOS"

      - name: Scan organization repositories
        env:
          ORG_NAME: ${{ env.ORG_NAME }}
          FILE_NAME: ${{ env.FILE_NAME }}
          EXCLUDE_REPOS: ${{ env.EXCLUDE_REPOS }}
          ORG_PAT: ${{ secrets.ORG_PAT }}   # volitelný; pokud není nastaven, použije se GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${ORG_PAT:-$GITHUB_TOKEN}"
          ORG="$ORG_NAME"
          FILE="$FILE_NAME"
          EXCLUDE="$EXCLUDE_REPOS"

          report_md="report_${ORG}_$(date +%Y%m%d_%H%M%S).md"
          report_csv="report_${ORG}_$(date +%Y%m%d_%H%M%S).csv"

          echo "# Autograder report — $ORG" > "$report_md"
          echo "> Checked file: \`$FILE\`" >> "$report_md"
          echo "" >> "$report_md"
          echo "|repo|status|link|" >> "$report_md"
          echo "|---|---:|---|" >> "$report_md"

          echo "repo,status,link" > "$report_csv"

          page=1
          while :; do
            resp=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/$ORG/repos?per_page=100&page=$page")
            names=$(echo "$resp" | jq -r '.[].name' || true)
            if [ -z "$names" ]; then
              break
            fi
            for repo in $names; do
              # skip excluded repos
              if printf ",%s," "$EXCLUDE" | grep -q ",$repo,"; then
                continue
              fi
              # skip archived repos
              archived=$(echo "$resp" | jq -r ".[] | select(.name==\"$repo\") | .archived")
              if [ "$archived" = "true" ]; then
                echo "|$repo|archived|https://github.com/$ORG/$repo|" >> "$report_md"
                echo "$repo,archived,https://github.com/$ORG/$repo" >> "$report_csv"
                continue
              fi

              # get default branch for friendly link
              default_branch=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$ORG/$repo" | jq -r .default_branch)
              # check file
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$ORG/$repo/contents/$FILE")
              if [ "$code" = "200" ]; then
                link="https://github.com/$ORG/$repo/blob/$default_branch/$FILE"
                echo "|$repo|OK|$link|" >> "$report_md"
                echo "$repo,OK,$link" >> "$report_csv"
              else
                link="https://github.com/$ORG/$repo"
                echo "|$repo|MISSING|$link|" >> "$report_md"
                echo "$repo,MISSING,$link" >> "$report_csv"
              fi
            done

            page=$((page+1))
          done

          echo "" >> "$report_md"
          echo "_Generated at $(date)_" >> "$report_md"

          # save outputs
          mkdir -p reports
          mv "$report_md" "reports/"
          mv "$report_csv" "reports/"
          ls -l reports

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: autograde-report-${{ github.run_id }}
          path: reports
