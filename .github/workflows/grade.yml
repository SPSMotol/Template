name: Autograde (artifact-only)

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect & run tests / checks
        id: run_tests
        run: |
          set -o pipefail
          EXITCODE=0
          echo "Running autograde at $(date)"
          echo "COMMIT=${GITHUB_SHA}" > short-summary.txt

          if [ -f package.json ]; then
            echo "Project type: node" >> short-summary.txt

            # prefer npm ci if lockfile exists, otherwise npm install
            if [ -f package-lock.json ]; then
              echo "Using npm ci (package-lock.json present)" >> short-summary.txt
              npm ci --no-audit --prefer-offline 2>&1 | tee npm-install-output.txt || true
            else
              echo "No package-lock.json — running npm install" >> short-summary.txt
              npm install --no-audit --prefer-offline 2>&1 | tee npm-install-output.txt || true
            fi

            # run tests (if defined). Capture exit code but do not fail job.
            if npm test --version >/dev/null 2>&1; then
              npm test 2>&1 | tee test-output.txt || EXITCODE=${PIPESTATUS[0]}
            else
              # some projects have no test script — note that
              echo "No test script defined (skipping npm test)" > test-output.txt
            fi

          else
            echo "Project type: static-html (no package.json)" >> short-summary.txt
            if [ -f index.html ]; then
              echo "RESULT: index.html found" >> short-summary.txt
              cp index.html test-output.txt || true
            else
              echo "RESULT: index.html MISSING" >> short-summary.txt
              echo "index.html not found" > test-output.txt
              EXITCODE=1
            fi
          fi

          echo "EXIT=${EXITCODE}" >> short-summary.txt
          echo "Completed at $(date)" >> short-summary.txt

          # expose exitcode as step output
          echo "exitcode=${EXITCODE}" >> $GITHUB_OUTPUT

      - name: Upload logs and summary
        uses: actions/upload-artifact@v4
        with:
          name: autograde-logs-${{ github.run_id }}
          path: |
            test-output.txt
            npm-install-output.txt
            short-summary.txt

      - name: Print short summary
        run: |
          echo "----- Short summary -----"
          cat short-summary.txt || true
