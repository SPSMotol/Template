name: Autograde (artifact-only)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install
        run: npm ci --no-audit --prefer-offline

      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          echo "EXITCODE=${PIPESTATUS[0]}"
          # write short summary to a file
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "RESULT: PASS" > short-summary.txt
          else
            echo "RESULT: FAIL" > short-summary.txt
          fi
          echo "EXIT=${PIPESTATUS[0]}" >> short-summary.txt
          echo "COMMIT=${GITHUB_SHA}" >> short-summary.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: autograde-logs-${{ github.run_id }}
          path: |
            test-output.txt
            short-summary.txt

      - name: Show short summary (console)
        run: cat short-summary.txt
